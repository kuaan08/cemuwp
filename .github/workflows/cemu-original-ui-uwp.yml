name: Cemu Xbox One - Original UI (D3D12 experimental)

on:
  push:
    branches:
      - 'uwp/d3d11-dual'
    paths:
      - '.github/workflows/cemu-original-ui-uwp.yml'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'dependencies/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cemu-original-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-ui-xbox-one-x64:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      VCPKG_ROOT: "${{ github.workspace }}/dependencies/vcpkg"
      VCPKG_FORCE_DOWNLOADED_BINARIES: "true"
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite"

    steps:
      - name: Checkout original Cemu source (keep the ImGui Xbox frontend)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch only original Cemu dependencies (exclude Rodrigo ports)
        shell: pwsh
        run: |
          git submodule update --init --recursive -- dependencies/ZArchive dependencies/cubeb dependencies/vcpkg dependencies/Vulkan-Headers dependencies/imgui dependencies/metal-cpp dependencies/xbyak_aarch64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Prepare dependency cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/vcpkg-bincache" | Out-Null

      - name: Restore vcpkg binaries and downloads
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-bincache
            dependencies/vcpkg/downloads
          key: xboxone-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'dependencies/vcpkg_triplets/x64-uwp-static-md.cmake') }}-${{ github.run_id }}
          restore-keys: |
            xboxone-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'dependencies/vcpkg_triplets/x64-uwp-static-md.cmake') }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: ./dependencies/vcpkg/bootstrap-vcpkg.bat

      - name: Generate temporary UWP signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=CemuXboxOneLegacy" -KeyUsage DigitalSignature -FriendlyName "Cemu Xbox One Original UI D3D12 development certificate" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String "cemu" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE/CemuLegacyUI_TemporaryKey.pfx" -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE/CemuLegacyUI.cer" | Out-Null

      - name: Set separate original-UI app identity and package version
        shell: pwsh
        run: |
          $p = 'src/gui/host/uwp/Package.appxmanifest'
          $xml = Get-Content $p -Raw
          $xml = $xml.Replace('Name="CemuUWP.Unofficial"', 'Name="CemuXboxOneLegacy.Kuaan08"')
          $xml = $xml.Replace('Publisher="CN=CemuUWP"', 'Publisher="CN=CemuXboxOneLegacy"')
          $xml = $xml.Replace('<DisplayName>Cemu UWP</DisplayName>', '<DisplayName>Cemu Xbox One Original UI</DisplayName>')
          $xml = $xml.Replace('DisplayName="Cemu UWP"', 'DisplayName="Cemu Xbox One Original UI"')
          $xml = $xml.Replace('<uap:Protocol Name="cemu">', '<uap:Protocol Name="cemu-legacy">')
          $xml = $xml.Replace('Version="0.1.0.0"', 'Version="0.2.${{ github.run_number }}.0"')
          if ($xml -notmatch 'Name="CemuXboxOneLegacy.Kuaan08"' -or $xml -notmatch 'Publisher="CN=CemuXboxOneLegacy"') {
            throw "Original UI manifest identity patch failed"
          }
          Set-Content -Path $p -Value $xml -Encoding utf8
          Select-String -Path $p -Pattern 'CemuXboxOneLegacy|Version="0.2.'

      - name: Configure UWP x64
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build-uwp -G "Visual Studio 17 2022" -A x64 -DCMAKE_SYSTEM_NAME=WindowsStore -DCMAKE_SYSTEM_VERSION=10.0 -DVCPKG_INSTALL_OPTIONS="--clean-after-build" 2>&1 | tee cmake.log

      - name: Build signed MSIX package
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-uwp --config Release --target CemuBin -- -m -p:GenerateAppxPackageOnBuild=true -p:AppxBundle=Never -p:UapAppxPackageBuildMode=SideloadOnly -p:AppxPackageSigningEnabled=true -p:PackageCertificateKeyFile="$GITHUB_WORKSPACE/CemuLegacyUI_TemporaryKey.pfx" -p:PackageCertificatePassword=cemu -p:AppxPackageDir="$GITHUB_WORKSPACE/AppPackages/" 2>&1 | tee build.log

      - name: Package complete Xbox installer and dependencies
        shell: bash
        run: |
          set -euo pipefail
          MSIX=$(find AppPackages -type f -name '*.msix' | head -n 1)
          test -n "$MSIX"
          PKGDIR=$(dirname "$MSIX")
          mkdir -p xbox-one-install
          cp -r "$PKGDIR"/. xbox-one-install/
          cp CemuLegacyUI.cer xbox-one-install/
          rm -rf xbox-one-install/Dependencies/ARM xbox-one-install/Dependencies/ARM64 xbox-one-install/Dependencies/x86 xbox-one-install/TelemetryDependencies
          cd xbox-one-install
          7z a -tzip ../cemu-xbox-one-original-ui-d3d12-x64.zip . > /dev/null

      - name: Upload complete Xbox One installer
        uses: actions/upload-artifact@v4
        with:
          name: cemu-xbox-one-original-ui-d3d12-x64
          path: cemu-xbox-one-original-ui-d3d12-x64.zip
          retention-days: 30

      - name: Upload compiler logs for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cemu-xbox-one-original-ui-ci-logs
          path: |
            cmake.log
            build.log
          if-no-files-found: ignore
          retention-days: 14
